<body>
<div class="app" id="app">

        <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>

      </defs>
      <g id="sunFx" class="fx" style="opacity:0">
        <circle cx="234" cy="56" r="46" fill="#F8E4B3" filter="url(#blurSoft)"/>
        <circle cx="234" cy="56" r="30" fill="#F4D280"/>
      </g>
      <g id="floater">
        <g id="breather">
          <g id="body">
            <g fill="rgba(38,49,60,.16)">
              <circle cx="95" cy="136" r="52"/><circle cx="150" cy="110" r="66"/><circle cx="208" cy="134" r="52"/>

              <ellipse class="eye" cx="176" cy="140" rx="6.5" ry="9.5" fill="var(--face)"/>
              <path class="brow" id="browL" d="M121 123 L140 123" stroke="var(--face)" stroke-width="5" stroke-linecap="round"/>
              <path class="brow" id="browR" d="M166 123 L185 123" stroke="var(--face)" stroke-width="5" stroke-linecap="round"/>
              <g fill="none" stroke="var(--face)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

                <path class="mouth" data-m="frown" d="M144 168 Q153 160 162 168" style="opacity:0"/>

                <path class="mouth" data-m="tense" d="M142 166 L147 162 L153 167 L159 162 L164 166" style="opacity:0"/>
              </g>
            </g>
          </g>
        </g>
      </g>
      <g id="rainFx" class="fx" style="opacity:0">
        <g id="rainDrops" stroke="#62A0E9" stroke-width="3" stroke-linecap="round">
          <line x1="104" y1="206" x2="100" y2="216"/><line x1="134" y1="210" x2="130" y2="220"/>

        <polygon id="bolt" points="160,202 146,222 156,222 149,238 172,214 161,214 168,202" fill="#ECB226"/>

<div class="parade" id="parade" aria-hidden="true"></div><div class="scene" id="scene"></div><div class="chars" id="chars"><div id="charWrap"></div><svg id="charFog" viewBox="0 0 340 330" preserveAspectRatio="none" aria-hidden="true"><g fill="#FFFFFF"><rect x="0" y="196" width="340" height="16" rx="8" opacity=".85"></rect><rect x="30" y="236" width="300" height="14" rx="7" opacity=".75"></rect><rect x="10" y="150" width="250" height="12" rx="6" opacity=".7"></rect><rect x="60" y="112" width="220" height="10" rx="5" opacity=".6"></rect></g></svg></div>
